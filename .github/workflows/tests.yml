name: tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  # release.yml runs the suite before publishing a tag.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']
        nest: ['10', '11', '12']
        include:
          # The optional integrations that match each NestJS major.
          - nest: '10'
            extras: '@nestjs/config@3 @nestjs/cache-manager@2 cache-manager@5'
          - nest: '11'
            extras: '@nestjs/config@4 @nestjs/cache-manager@3 cache-manager@6'

    name: Node ${{ matrix.node }} - NestJS ${{ matrix.nest }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # package-lock.json pins the newest NestJS major (the dev dependencies); older majors are
      # installed over it without touching the lock file.
      - name: Install NestJS ${{ matrix.nest }}
        if: matrix.nest != '12'
        shell: bash
        run: |
          npm install --no-save \
            "@nestjs/common@${{ matrix.nest }}" "@nestjs/core@${{ matrix.nest }}" \
            "@nestjs/testing@${{ matrix.nest }}" "@nestjs/platform-express@${{ matrix.nest }}" \
            "@nestjs/platform-fastify@${{ matrix.nest }}" ${{ matrix.extras }}
          npm ls @nestjs/core @nestjs/config @nestjs/cache-manager || true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Test the build
        run: npm run test:dist

      - name: Check the package (publint, are-the-types-wrong)
        run: npm run check:package

  # The lowest versions package.json accepts: NestJS 10.0.0 with the oldest optional integrations,
  # rxjs 7.1.0 and the SDK floor from package-lock.json. The build comes from the locked
  # dependencies first, because rxjs 7.1.0 ships no type declarations TypeScript can resolve
  # through its exports.
  lowest:
    runs-on: ubuntu-latest

    name: Node 20 - lowest dependencies

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install the lowest versions
        run: |
          npm install --no-save \
            @nestjs/common@10.0.0 @nestjs/core@10.0.0 @nestjs/testing@10.0.0 \
            @nestjs/platform-express@10.0.0 @nestjs/platform-fastify@10.0.0 \
            @nestjs/config@3.0.0 @nestjs/cache-manager@2.0.0 cache-manager@5.0.0 \
            rxjs@7.1.0 reflect-metadata@0.1.13
          npm ls @laranex/myanmar-payments @nestjs/core rxjs || true

      - name: Test
        run: npm run test:coverage

      - name: Test the build
        run: npm run test:dist
